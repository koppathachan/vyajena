# Contract, build and app checks (core-wire-protocol task 3.1; wire-transport:
# Protobuf contract is the source of truth).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ci-release design D16: each check runs only when its code changed. A
  # skipped job counts as passed for the required checks, so the job names
  # below stay the same.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      proto: ${{ steps.diff.outputs.proto }}
      rust: ${{ steps.diff.outputs.rust }}
      flutter: ${{ steps.diff.outputs.flutter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="origin/$BASE_REF"; else base="$BEFORE"; fi
          CI_BASE="$base" .github/scripts/ci-changes.sh >> "$GITHUB_OUTPUT"

  proto:
    name: buf lint and breaking
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          version: 1.50.0
          setup_only: true

      - name: buf lint
        run: buf lint

      # Pull requests compare against the base branch (main); pushes to main
      # compare against the previous main. The check is skipped while the
      # baseline has no .proto files yet (the commit that adds the contract).
      - name: buf breaking against main
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            against="origin/$BASE_REF"
          else
            against="$BEFORE"
          fi
          if [ -z "$against" ] || [ "$against" = "0000000000000000000000000000000000000000" ] \
              || ! git rev-parse --verify --quiet "$against^{commit}" > /dev/null; then
            echo "::notice::No baseline commit for buf breaking; skipping."
            exit 0
          fi
          if ! git ls-tree -r --name-only "$against" -- proto | grep -q '\.proto$'; then
            echo "::notice::Baseline $against has no .proto files yet; skipping buf breaking."
            exit 0
          fi
          sha=$(git rev-parse "$against^{commit}")
          buf breaking --against ".git#ref=$sha"

  rust:
    name: cargo build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

  # flutter-app task 7.1. Widget tests only (app/test/, over a fake core, no
  # Rust); integration_test/ needs a simulator and runs locally. Generated
  # bindings are committed and never produced here. Not run yet: nothing has
  # been pushed.
  flutter:
    name: flutter analyze and test
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test
