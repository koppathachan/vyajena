[package]
name = "client"
version = "0.1.0"
description = "The vyajena2 device core: OpenMLS, keys, the local store and the server connection behind one async API and one event stream."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
protocol = { path = "../protocol" }

# gRPC client stubs. client/src/pb.rs is generated by `cargo run -p pbgen` and committed.
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-stream = "0.1"

# Pinned TLS to the relay (wire-transport: gRPC over HTTP/2 and pinned TLS):
# TLS 1.3 only, the server accepted by its SPKI SHA-256 pin alone.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "ring"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

# Identity, device auth and MLS signature keys (Ed25519).
ed25519-dalek = "2"
# Invite and link payloads in text form (base64url, as the server prints them).
base64 = "0.22"

# MLS. Group state is stored by our own encrypted SQLite provider (design D3).
openmls = "=0.9.2"
openmls_rust_crypto = "0.6"
openmls_traits = "0.6"
serde = "1"
serde_json = "1"

# Keys: the OS keychain, or an opt-in 0600 file (design D3).
keyring = "4.2"
# Phone key stores (flutter-app design D4) use keyring-core and the native
# store crates directly: keyring's own Entry has no default store on phones.
keyring-core = "1"
zeroize = "1"
getrandom = "0.3"

# Local store: SQLite, OpenMLS values sealed under the storage key (design D3).
rusqlite = { version = "0.37", features = ["bundled"] }
parking_lot = "0.12"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"

# Images (media-blobs design D5): decode, orient, scale and lossy-encode WebP,
# and the ThumbHash placeholder. libwebp is C: built for each target by its cc
# step, as the native key stores already are.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
webp = { version = "0.3", default-features = false }
thumbhash = "0.1"

# Voice messages (audio-messages design D4): Opus encode and the OGG container, in
# pure Rust, so no C library or cmake is needed for the phone targets (spike S1).
opus-pure = "0.2"

thiserror = "2"
# Logging: ids, epochs, sizes; never content.
tracing = "0.1"

[target.'cfg(target_os = "ios")'.dependencies]
# The data-protection keychain; the crate refuses to build on iOS without it.
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }

[target.'cfg(target_os = "android")'.dependencies]
# Secrets AES-GCM-sealed under an Android Keystore key, in app-private prefs.
android-native-keyring-store = "1.0.0"

[dev-dependencies]
tempfile = "3"
# End-to-end tests run the real server in-process (design D8).
server = { path = "../server" }
# RUST_LOG=client=debug shows the engine's steps in a failing test.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# OpenMLS test groups for the encrypted storage tests.
openmls_basic_credential = "0.6"
