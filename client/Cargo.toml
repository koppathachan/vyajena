[package]
name = "client"
version = "0.1.0"
description = "The vyajena2 device core: OpenMLS, keys, the local store and the Pi connection behind one async API and one event stream."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
protocol = { path = "../protocol" }

# gRPC client stubs. client/src/pb.rs is generated by `cargo run -p pbgen` and committed.
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-prost = "0.14"
tokio = { version = "1", features = ["rt", "sync"] }

# MLS. Group state is stored by our own encrypted SQLite provider (design D3).
openmls = "=0.9.2"
openmls_rust_crypto = "0.6"
openmls_traits = "0.6"
serde = "1"
serde_json = "1"

# Keys: the OS keychain, or an opt-in 0600 file (design D3).
keyring = "4.2"
zeroize = "1"
getrandom = "0.3"

# Local store: SQLite, OpenMLS values sealed under the storage key (design D3).
rusqlite = { version = "0.37", features = ["bundled"] }
parking_lot = "0.12"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"

thiserror = "2"
# Logging: ids, epochs, sizes; never content.
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# OpenMLS test groups for the encrypted storage tests.
openmls_basic_credential = "0.6"
