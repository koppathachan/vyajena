# flutter_rust_bridge codegen (flutter-app design D2). Run in app/:
#   flutter_rust_bridge_codegen generate
# It reads bridge/src/api and writes bridge/src/frb_generated.rs and
# lib/src/rust/ (both committed). Never run in CI.
rust_input: crate::api
rust_root: ../bridge/
dart_output: lib/src/rust
# iOS and Android only.
web: false
