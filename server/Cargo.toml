[package]
name = "server"
version = "0.1.0"
description = "The vyajena2 Pi server: routing, ordering and membership for one end-to-end encrypted group."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }

# gRPC. server/src/pb.rs is generated by `cargo run -p pbgen` and committed.
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "server"] }
tonic-prost = "0.14"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"

# TLS: TLS 1.3 only, self-signed certificate, clients pin the SPKI (D6).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

# Keys and hashing.
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"

# MLS: the Pi tracks the group's public state with PublicGroup (no secrets).
openmls = "=0.9.2"
openmls_rust_crypto = "0.6"
openmls_memory_storage = "0.6"

# The auth layer in front of every service (wire-transport: Session authentication).
tower = { version = "0.5", default-features = false }

# Storage (D5).
rusqlite = { version = "0.37", features = ["bundled"] }

# Config and errors.
toml = "0.9"
thiserror = "2"
anyhow = "1"

# Logging: ids, epochs, sizes; never content.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
# gRPC clients over the pinned TLS stream.
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
# OpenMLS test clients: KeyPackages, groups, commits and Welcomes.
openmls_basic_credential = "0.6"
openmls_traits = "0.6"
# Parses the served certificate's SPKI in the pinned-TLS test client.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "ring"] }
