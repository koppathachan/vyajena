# Example local config (server-runtime: Running locally). Start the server with:
#
#   cargo run -p server -- --config server/local.toml
#
# Relative paths are resolved from this file's folder, so the database and keys
# land in server/.server-local/ (git-ignored). Delete that folder to start fresh.

# The part after "@" in every user id.
server_id = "chat"
# The admin is admin_username@server_id; the bootstrap invite creates that user.
admin_username = "akhil"
# Unprivileged local port; on the server this is the port the relay forwards to.
listen_address = "127.0.0.1:8443"
# What invite payloads tell clients to dial. Optional; defaults to listen_address.
public_address = "127.0.0.1:8443"
database_path = ".server-local/server.sqlite"
key_dir = ".server-local/keys"

# Optional operator-tunable limits. Every field defaults to the built-in value,
# so an absent [limits] table (or an absent field) keeps today's behaviour.
# Durations are whole seconds; changes apply on restart. Uncomment to override.
# [limits]
# inactivity_timeout = 604800            # 7 days: idle before a device is removed.
#                                        #   raise (e.g. 2592000 = 30 days) so a
#                                        #   backgrounded phone is not dropped; the
#                                        #   trade-off is inactive leaves linger in
#                                        #   the MLS tree. Raise queue_entry_ttl too.
# queue_entry_ttl = 604800               # 7 days: a returning device only gets
#                                        #   messages newer than this; raise with
#                                        #   inactivity_timeout, at the cost of storage.
# queue_cap = 1000                       # per-device queue before marked inactive.
# stream_idle_timeout = 90               # seconds idle before a stream is reaped.
# invite_ttl = 604800                    # 7 days.
# blob_ttl = 604800                      # 7 days.
# challenge_ttl = 60                     # seconds an auth challenge is valid.
# dedup_min_retention = 604800           # 7 days; keep >= queue_entry_ttl.
# wake_ping_min_interval = 60            # min seconds between wake pushes per device.
# catch_up_max = 5                       # bounded catch-up push attempts per backlog.
# sweep_interval = 60                    # seconds between periodic sweeps.
# max_blob_store_bytes = 1073741824      # 1 GiB blob-store ceiling.
# max_uploads_per_device_per_hour = 60
# max_video_blob_bytes = 5242880         # the one maximum blob ciphertext size,
#                                        #   enforced on every upload and advertised
#                                        #   to clients (video-messages). Clamped to
#                                        #   [image cap, 8 MiB]; default 5 MiB. A
#                                        #   30 s 480p clip is about 4 MB. Raise to
#                                        #   allow longer/larger clips; edit +
#                                        #   restart, no rebuild.
