# Example local config (pi-runtime: Running locally). Start the server with:
#
#   cargo run -p server -- --config server/local.toml
#
# Relative paths are resolved from this file's folder, so the database and keys
# land in server/.pi-local/ (git-ignored). Delete that folder to start fresh.

# The part after "@" in every user id.
server_id = "pi"
# The admin is admin_username@server_id; the bootstrap invite creates that user.
admin_username = "akhil"
# Unprivileged local port; on the Pi this is the port the relay forwards to.
listen_address = "127.0.0.1:8443"
# What invite payloads tell clients to dial. Optional; defaults to listen_address.
public_address = "127.0.0.1:8443"
database_path = ".pi-local/pi.sqlite"
key_dir = ".pi-local/keys"
