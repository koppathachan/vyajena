[package]
name = "vyajena-proto"
version = "0.1.0"
description = "Generated Rust code and wire constants for the vyajena.v1 protobuf contract."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-prost = "0.14"

[build-dependencies]
# protox is a pure-Rust protobuf compiler, so the build needs no system protoc.
protox = "0.10"
tonic-prost-build = "0.14"
