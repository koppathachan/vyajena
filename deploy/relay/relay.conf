# The relay's fixed names, sizes and versions (relay design D2, D3). Sourced by
# deploy/relay/*.sh and deploy/server/*.sh; read by server/tests/deploy_files.rs.
# Plain KEY=value lines only. No secrets: those live in ~/.vyajena-relay/.

# The old vyajena project (owner, 2026-11-16), not purple-eccdf.
PROJECT=vyajena
# Mumbai, next to the server and its users (change relay-mumbai, owner 2026-11-20):
# the old us-east1 relay put ~260 ms on every round trip. Not in the always-free
# tier: about $11/month (e2-micro, static IPv4, disk).
REGION=asia-south1
ZONE=asia-south1-c
NAME=vyajena-relay
MACHINE_TYPE=e2-micro
IMAGE_FAMILY=debian-13
IMAGE_PROJECT=debian-cloud
# Standard persistent disk, at most 30 GB.
DISK_TYPE=pd-standard
DISK_GB=10
# Invites name RELAY_HOST:PUBLIC_PORT (owner, 2026-11-16: "lets do dns now"):
# an A record at the owner's DNS points it at the static IPv4. The server's tunnel
# dials the IPv4 itself (relay.env), so the server needs no DNS.
RELAY_HOST=vyajarelay.purplechaamba.com
# Devices dial PUBLIC_PORT; the server dials TUNNEL_PORT.
PUBLIC_PORT=443
# Store reviewers' separate server (change review-server): the relay's public
# REVIEW_PORT goes to the server's review loopback port, through the same tunnel.
# The ports, ranges and addresses of the real deployment are not here: they are
# in ~/.vyajena-relay/network.conf (deploy/network.conf.example, deploy/network.sh).
SSH_USER=vyajena
# rathole is built from crates.io with its own Cargo.lock (--locked); that lock
# needs a Rust older than 1.80 (its `time` crate fails on newer ones, D3).
RATHOLE_VERSION=0.5.0
RATHOLE_FEATURES=server,client,noise
RATHOLE_IMAGE=rust:1.79-bookworm
