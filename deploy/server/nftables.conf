#!/usr/sbin/nft -f
# The server's firewall (server-deployment design D4), installed by harden.sh as
# /etc/nftables.conf and loaded at boot by nftables.service.
#
# Inbound is dropped except replies, loopback, SSH from the home IPv4 subnet,
# and the ICMP/ICMPv6 a LAN host needs (relay design D5). The server listens on
# loopback only and devices reach it through the tunnel the server dials out, so
# no server port is open. Inbound IPv6 is dropped except link-local control
# traffic and replies, so the ISP's global IPv6 addresses expose nothing.
# Outbound is open (the tunnel, updates).

flush ruleset

define home_v4 = @HOME_LAN@

table inet vyajena {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iif "lo" accept

		# IPv4 from the home network: ping, DHCP replies and SSH.
		ip saddr $home_v4 icmp type { echo-request, destination-unreachable, time-exceeded } accept
		ip saddr $home_v4 udp sport 67 udp dport 68 accept
		ip saddr $home_v4 tcp dport 22 accept

		# IPv6: neighbour discovery and router adverts only from the link
		# (hop limit 255 cannot come through a router), link-local ICMPv6
		# and DHCPv6 replies. Nothing from a global address.
		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } ip6 hoplimit 255 accept
		ip6 saddr fe80::/10 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
