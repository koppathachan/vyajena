# The server's own deploy settings (change media-blobs). Sourced by
# deploy/relay/render.sh and deploy/server/*.sh; read by server/tests/deploy_files.rs.
# Plain KEY=value lines only. No secrets. SERVER_CONF=<file> points a script at
# another copy (tests do).

# Where the server keeps encrypted image blobs (blob-store: Pluggable storage
# backend; server-deployment: Blob store deployment): the stable path the drive is
# mounted at, the same on every start, which the owner's auto-mount provides.
# Deploy never mounts it.
#
#   BLOB_DIR=            images are off: the server has no [blob_store], and
#                        the server is as before this feature (the default)
#   BLOB_DIR=/mnt/x      images on, stored in /mnt/x
#
# It must be an absolute path on a mount of its own (never on the SD card),
# outside /var/lib/vyajena (which the backup copies and a reset wipes) and
# outside /home and /root (the service cannot see those). Deploy gives it to
# the service user (mode 0700) only if it is on a mount of its own; with the
# drive absent it leaves the path alone, warns, and the server serves text.
BLOB_DIR=/mnt/vyajena/blobs
