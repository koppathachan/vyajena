# The store reviewers' server (review-server design D1): a second instance of
# the same binary, rendered by deploy/relay/render.sh and installed by
# deploy.sh as /etc/vyajena/review.toml. Separate ids, data and keys: it never
# sees the real group. Reset it at will with deploy.sh --reset-review.

# Fixed at its first start, like the real server's (a different server id, so
# no real device certificate is valid here).
server_id = "review.purplechaamba.com"
admin_username = "review"
# Loopback only; the relay's REVIEW_PORT reaches it through the tunnel.
listen_address = "127.0.0.1:8444"
public_address = "@RELAY_HOST@:@REVIEW_PORT@"
database_path = "/var/lib/vyajena-review/pi.sqlite"
key_dir = "/var/lib/vyajena-review/keys"

# review-server: Review mode (design D6). The bootstrap invite never expires
# and each use starts a fresh review (one set of sign-in details for the
# stores); at most the admin and one other user. Never in config.toml.
review_mode = true
