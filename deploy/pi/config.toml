# The Pi's server config (pi-deployment design D4), installed by deploy.sh as
# /etc/vyajena/config.toml. No secrets: the keys and the database live in
# /var/lib/vyajena (the service's StateDirectory, mode 0700).

# The part after "@" in every user id; fixed at the first start.
server_id = "pi"
# The admin is admin_username@server_id; the bootstrap invite creates that user.
admin_username = "akhil"
# Home-LAN phase: every address, port 8443. nftables lets only the home IPv4
# subnet reach it. The relay change sets 127.0.0.1:8443 behind the tunnel.
listen_address = "0.0.0.0:8443"
# What invites tell devices to dial: the Pi's static LAN address on eth0.
public_address = "192.168.1.8:8443"
database_path = "/var/lib/vyajena/pi.sqlite"
key_dir = "/var/lib/vyajena/keys"
