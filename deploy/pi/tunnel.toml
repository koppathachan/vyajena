# rathole on the Pi (relay design D5), rendered by deploy/relay/render.sh with
# the secrets from ~/.vyajena-relay/ and installed by deploy/pi/deploy.sh as
# /etc/vyajena/tunnel.toml (0600 root, passed to the service as a credential).
# The Pi dials out; nothing listens at home.

[client]
remote_addr = "@RELAY_IP@:@TUNNEL_PORT@"
heartbeat_timeout = 40
retry_interval = 1

[client.transport]
type = "noise"

[client.transport.noise]
pattern = "Noise_NK_25519_ChaChaPoly_BLAKE2s"
# Pinned: the Pi attaches only to a relay that proves this key.
remote_public_key = "@NOISE_PUBLIC_KEY@"

[client.services.vyajena]
type = "tcp"
token = "@TOKEN@"
local_addr = "127.0.0.1:8443"
nodelay = true

# The review server (review-server design D1), its own token.
[client.services.review]
type = "tcp"
token = "@REVIEW_TOKEN@"
local_addr = "127.0.0.1:8444"
nodelay = true
