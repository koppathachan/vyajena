schema: spec-driven

context: |
  vyajena2: end-to-end encrypted chat (text, and one picture per message) for a system lobby and admin-created
  named groups, plus DMs between its members (changes `dms`, `lobby-multi-group`;
  admin and owner: Akhil). Flutter UI (view only, never opens a connection) -> Rust core on
  each device (OpenMLS RFC 9420, networking, SQLite, keys in the OS key store, via
  flutter_rust_bridge) -> dumb GCP TCP relay (rathole) -> Rust server (tokio +
  tonic, SQLite WAL). gRPC over HTTP/2 with pinned TLS on port 443.

  Source of truth, in order: docs/architecture-decisions.md, the proto contract
  (proto/vyajena/v1, package vyajena.v1), then openspec/specs. Proto-first: the
  .proto changes before any code that depends on it. Open decisions are listed in
  the architecture doc and belong to the owner.

  Invariants (changed only by an owner-approved change):
  - Keys never leave the Rust core. Decrypted text and pictures reach Dart only to be
    shown; Dart never stores, logs or sends them. Nothing logs content. The relay
    and the server see ciphertext only.
  - The server is the authority for routing, ordering and membership, never history.
    Group settings and profiles travel only inside encrypted messages.
  - Strict epoch rule; OpenMLS max_past_epochs = 0.
  - Commit authority: in the lobby and in a named group admin devices commit anything; other
    devices only their own leaf update, adding or removing their own user's
    devices, and server-issued inactivity Removes. In a DM every member device
    commits only its own leaf update, Adds of either user's devices, Removes of
    its own user's devices and server-issued Removes; no admin, never a third user
    (change `dms`, owner 2026-11-17); a named group uses the admin rule above
    (change `lobby-multi-group`, owner 2026-11-20). The server and every client both
    check it.
  - OpenMLS skips credential checks: verify each leaf's device certificate against
    the user's pinned identity key, and that its MLS key equals the leaf key.
  - Accepted means durable. Nothing is dropped silently. An accepted,
    undelivered APPLICATION message MAY be retracted from other devices' queues
    only by a message delete (change `delete-messages`, owner-approved
    2026-11-20) — authorised (an admin in the lobby or a named group, the
    original sender in a DM) and always paired with a delivered Delete
    tombstone, so the message is superseded, never silently lost.
  - Identity, auth and MLS signature keys live only in the OS key store
    (desktop: the OS keychain; a 0600 key file only on explicit opt-in where
    there is none). OpenMLS group state is in SQLite only sealed under a
    storage key from the key store; messages are not encrypted at rest.
  - User ids are <username>@<server_id>; the admin chooses the username.
  - Limits, timings and signing context strings are defined once, in protocol/,
    which both the server and the core use. One owner-approved exception
    (change video-messages, 2026-11-23): the server's maximum blob size is
    config-driven (max_video_blob_bytes), read at startup and clamped within a
    protocol/ ceiling [image cap, MAX_VIDEO_BYTES]; protocol/ still bounds it.
  - The core owns every media transform (image/audio encode pipelines). One
    owner-approved exception (change video-messages, 2026-11-23): video
    normalization (H.264/MP4 transcode) runs in a native platform plugin, since
    no viable pure-Rust mobile H.264 transcode exists; the core still does all
    blob crypto and keys never leave it.

  Rust: edition 2024, one Cargo workspace at the repo root. thiserror in
  libraries, anyhow only in binaries. tracing for logs (ids, epochs, sizes; never
  content). forbid(unsafe_code) except isolated FFI glue. No unwrap, expect or
  panicking indexing on bytes from the network, MLS or the database. clippy
  -D warnings clean. Generated proto code is committed: one pb.rs per side,
  server stubs in the server crate, client stubs in the core; regenerated locally by
  one command, never in CI. Tests live in each crate's tests/ folder (public API
  only, like a Go _test package), never in source files. Folders follow
  features (one module per gRPC service on the server) so a feature can be split
  out later.

rules:
  proposal:
    - Name the open decisions it resolves and the .proto files it touches.
  specs:
    - Put SHALL or MUST in the first sentence of every requirement.
    - Scenarios use concrete actors (Alice, Bob, the admin) and name the RPC, message or enum value involved.
    - "Requirement titles are test ids (// spec: <capability>/<title-slug>); change one only with RENAMED."
    - Security requirements say who enforces them, the server or the client.
  design:
    - Number decisions D1, D2, ... and draw changed flows as Mermaid diagrams.
    - Record each spike's result under the decision it tests.
  tasks:
    - Proto tasks come first; a spike comes before code that relies on a risky assumption.
    - If an invariant changes, include updating docs/architecture-decisions.md and this config's context.

operations:
  apply:
    guidance:
      - "Every spec requirement gets at least one test naming it, // spec: <capability>/<title-slug>."
      - If the code shows a spec is wrong, fix the spec first and record why in design.md.
      - Spikes go in spikes/<name>/ (git-ignored, outside the workspace) and are deleted once their result is in design.md.
  archive:
    guidance:
      - Check that no spike code is left under spikes/ before archiving.
