// Messaging service: the one persistent stream that carries all messaging.
//
// `Connect` requires a session token (wire-transport: Session authentication).
// The sender of everything a device sends on the stream is the device that
// authenticated it.
syntax = "proto3";

package vyajena.v1;

import "google/protobuf/timestamp.proto";
import "vyajena/v1/common.proto";

// buf:lint:ignore SERVICE_SUFFIX
// Service name as used in the specs and design D11.
service Messaging {
  // wire-transport: Single persistent messaging stream. One bidirectional stream
  // per connection carries outgoing envelopes, incoming envelopes, send results,
  // acks, catch-up replay and heartbeats. The server allows at most one open stream
  // per device. When a new stream opens it closes the older one with gRPC status
  // `ABORTED`.
  //
  // wire-transport: Protocol version negotiation. The first client frame is a
  // `Hello`. If the server does not support its version it closes the stream with
  // `FAILED_PRECONDITION` and lists the supported versions in the status.
  //
  // wire-transport: Heartbeats. While the stream is idle the client sends a
  // `Heartbeat` at least every 25 seconds and the server replies to each. The server
  // closes a stream that has received nothing for 90 seconds and treats the
  // device as offline.
  //
  // message-delivery: Ordered delivery and catch-up. On connect the server sends
  // everything after the device's cursor (commit log entries, welcomes and
  // queued application entries, merged in `server_seq` order) before any live
  // traffic. A device added by a commit gets that commit's `WELCOME` instead of
  // the commit itself, at the commit's `server_seq`.
  //
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // The stream frames keep the names `ClientFrame` and `ServerFrame` from D11.
  rpc Connect(stream ClientFrame) returns (stream ServerFrame);
}

// A frame from the device to the server.
message ClientFrame {
  oneof frame {
    // Must be the first frame, and only the first.
    Hello hello = 1;
    Envelope envelope = 2;
    Ack ack = 3;
    Heartbeat heartbeat = 4;
  }
}

// A frame from the server to the device.
message ServerFrame {
  oneof frame {
    // An incoming envelope, with the server-set fields filled in.
    Envelope envelope = 1;
    SendResult send_result = 2;
    GapNotice gap_notice = 3;
    LowKeyPackages low_key_packages = 4;
    RemovedNotice removed_notice = 5;
    RejoinNotice rejoin_notice = 6;
    // The server's reply to a client `Heartbeat`.
    Heartbeat heartbeat = 7;
    JoinNotice join_notice = 8;
    DmClosed dm_closed = 9;
    // multi-group: Closing a named group (change `lobby-multi-group`).
    GroupClosed group_closed = 10;
    // message-deletion: Removed-conversation sync (change `remove-closed-dm`).
    ConversationRemoved conversation_removed = 11;
  }
}

// wire-transport: Protocol version negotiation.
message Hello {
  // The protocol version this client speaks, one of
  // `ServerInfo.supported_protocol_versions` (vyajena_proto::PROTOCOL_VERSION).
  uint32 protocol_version = 1;
}

// message-delivery: Envelope. Every message on the stream is carried in one.
//
// Size (wire-transport: Size limits): an `APPLICATION` envelope's `ciphertext`
// is at most 65,536 bytes; a `COMMIT` envelope, encoded with its `welcome`, and a
// `PROPOSAL` envelope are at most 262,144 bytes. The client refuses to send one
// over its limit; the server rejects it with `REJECTION_REASON_TOO_LARGE` and stores
// nothing.
//
// Framing (message-delivery: Framing matches the envelope): the server parses the
// MLS framing of every envelope and rejects it with `REJECTION_REASON_MALFORMED`
// if its group id, epoch or content type do not match `group_id`, `epoch` and
// `kind`. `APPLICATION` carries an MLS `PrivateMessage`; `COMMIT` and `PROPOSAL`
// carry an MLS `PublicMessage` (design D5). A client never sends `WELCOME`: the
// Server rejects a client envelope of that kind with `REJECTION_REASON_MALFORMED`.
//
// Welcomes (message-delivery: Welcome travels with its commit): a client sends
// a Welcome only in `welcome` of the `COMMIT` envelope that creates it. The server
// accepts or rejects the commit and its Welcome together, and only after
// accepting the commit emits a `WELCOME` envelope to each recipient device
// (design D7).
//
// Epoch (message-delivery: Strict epoch rule): the server rejects any envelope whose
// `epoch` is not the group's current epoch with `REJECTION_REASON_STALE_EPOCH`.
//
// Commits (group-membership: Commit authority; group-membership: server validates
// handshakes without group secrets): the server verifies a `COMMIT`'s signature
// against the committing leaf, checks that the committing leaf is the
// authenticated device's leaf, and applies the commit authority rule (design D6),
// rejecting with `REJECTION_REASON_POLICY_VIOLATION`.
message Envelope {
  // The kind of MLS message in `ciphertext`.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // An application message (MLS `PrivateMessage`).
    KIND_APPLICATION = 1;
    // A commit (MLS `PublicMessage`).
    KIND_COMMIT = 2;
    // An MLS `Welcome`. Sent only by the server, to each recipient of an accepted
    // commit's `welcome`; a client envelope of this kind is rejected with
    // `REJECTION_REASON_MALFORMED` (message-delivery: Welcome travels with its
    // commit).
    KIND_WELCOME = 3;
    // A proposal (MLS `PublicMessage`), including the server's external Remove
    // proposals (group-membership: Inactive devices are kept out).
    KIND_PROPOSAL = 4;
  }

  reserved 6;
  reserved "recipients";

  // --- Set by the sending client. ---

  // Client-generated, 16 bytes, unique per sending device (vyajena_proto::
  // MSG_ID_LEN). message-delivery: Idempotent sends. The server deduplicates
  // accepted envelopes on (sender device, `msg_id`) for at least 7 days; a
  // retry with identical ciphertext gets the original result and creates no new
  // entries, a retry with different ciphertext is rejected with
  // `REJECTION_REASON_DUPLICATE_MISMATCH`. Rejected envelopes leave no dedup
  // record.
  bytes msg_id = 1;
  // The MLS group id.
  bytes group_id = 2;
  // The MLS epoch the message was created in.
  uint64 epoch = 3;
  Kind kind = 4;
  // The TLS-serialized MLS `MLSMessage`.
  bytes ciphertext = 5;
  // `COMMIT` only, and required when the commit adds devices: the Welcome the
  // commit creates (message-delivery: Welcome travels with its commit). Unset
  // on every other kind, and on every envelope the server sends.
  WelcomeBundle welcome = 10;

  // --- Set by the server when it accepts the envelope; ignored if a client sets
  // them. ---

  // The device that authenticated the sending stream, regardless of anything
  // the client put here (message-delivery: Envelope). Unset when the server itself
  // is the sender, as for its external Remove proposals.
  DeviceRef sender = 7;
  // The next number in the group's single sequence (message-delivery: Envelope;
  // design D8).
  uint64 server_seq = 8;
  // When the server accepted the envelope.
  google.protobuf.Timestamp accepted_at = 9;
}

// message-delivery: Welcome travels with its commit. The Welcome a `COMMIT`
// creates, sent inside that `COMMIT` envelope.
//
// The server rejects the whole envelope with `REJECTION_REASON_MALFORMED` if
// `welcome` is not an MLS `Welcome`, if `recipients` is not exactly the devices
// the commit adds (read from the certificates in the Add proposals), or if a
// commit that adds devices carries no `WelcomeBundle`.
//
// After accepting the commit, the server sends each recipient one `Envelope` of kind
// `KIND_WELCOME` with: `ciphertext` = `welcome`; `group_id`, `msg_id`, `sender`,
// `server_seq` and `accepted_at` of the commit; `epoch` = the epoch the commit
// creates (the commit's `epoch` + 1). If the commit is rejected, no recipient
// ever receives its Welcome (group-membership: Automatic re-add).
message WelcomeBundle {
  // The TLS-serialized MLS `MLSMessage` with wire format `mls_welcome`.
  bytes welcome = 1;
  // The devices the Welcome is for: exactly the devices the commit adds.
  repeated DeviceRef recipients = 2;
}

// The server's answer to one client `Envelope`, matched by `msg_id`.
//
// message-delivery: Accepted means durable. The server sends `accepted` only after
// it has durably written the envelope and every queue or log entry it creates.
// The client shows the message as sending until then, and as accepted after.
message SendResult {
  bytes msg_id = 1;
  oneof result {
    Accepted accepted = 2;
    Rejected rejected = 3;
  }

  message Accepted {
    uint64 server_seq = 1;
    google.protobuf.Timestamp accepted_at = 2;
  }

  message Rejected {
    RejectionReason reason = 1;
    // Set with `REJECTION_REASON_STALE_EPOCH`: the group's current epoch
    // (message-delivery: Strict epoch rule).
    uint64 current_epoch = 2;
  }
}

// message-delivery: Acknowledgement. The highest `server_seq` the device has
// durably processed in `group_id`; cumulative. The server then deletes that device's
// queue entries up to it, advances its commit-log cursor and does not redeliver
// them.
// With `server_seq` 0 it acknowledges a `DmClosed` or a `GroupClosed` for
// `group_id` (changes `dms`, `lobby-multi-group`).
message Ack {
  bytes group_id = 1;
  uint64 server_seq = 2;
}

// wire-transport: Heartbeats. Sent by the client while idle, and by the server in
// reply.
message Heartbeat {}

// message-delivery: Expiry and gap notice. Sent when the device connects after
// `APPLICATION` entries for it expired (7 days after `accepted_at`) so it can
// show "messages before X expired".
message GapNotice {
  bytes group_id = 1;
  // `accepted_at` of the newest expired entry.
  google.protobuf.Timestamp newest_expired_at = 2;
}

// key-directory: Replenishment signal. Sent when the device's one-time
// KeyPackage count drops below 5; the device then uploads more with
// `Keys.UploadKeyPackages`.
message LowKeyPackages {
  // One-time KeyPackages the server still holds for this device.
  uint32 remaining = 1;
}

// group-membership: Automatic re-add. Sent to a device that was removed for
// inactivity (group-membership: Inactive devices are kept out) when it
// reconnects. The device waits on the stream for the Welcome that re-adds it;
// messages from while it was inactive are not delivered.
message RemovedNotice {
  bytes group_id = 1;
  // The start of the period whose messages this device will not receive, so
  // the app can show that messages since then were not kept.
  google.protobuf.Timestamp missed_since = 2;
}

// group-membership: Automatic re-add. Sent to the returning device's user's
// other connected devices and to the admin's connected devices. The first to
// receive it, with no user action, verifies the device's certificate against
// the user's pinned identity key, fetches a KeyPackage for that device only
// (`FetchKeyPackagesRequest.device_ids`), and commits its Add together with any
// pending Remove of its old leaf, with the Welcome in the same `COMMIT` envelope
// (allowed by the commit authority rule, design D6). A device that loses the
// race gets `REJECTION_REASON_STALE_EPOCH` for the commit and its Welcome
// together, so its Welcome is never delivered; it sees the device is already a
// member and does nothing more.
message RejoinNotice {
  bytes group_id = 1;
  // The returning device.
  DeviceRef device = 2;
}

// group-membership: Automatic add of new users. Sent to the admin's connected
// member devices for each non-revoked device that has never been a group
// member and whose user has no member device: once the device has uploaded its
// KeyPackages after `Devices.Register`, and again each time an admin device
// connects, until the device is a member. The first admin device to receive
// it, with no user action, fetches a KeyPackage for that device only
// (`FetchKeyPackagesRequest.device_ids`), verifies its certificate (pinning the
// user's identity key on first sight; a changed key waits for the admin to
// accept it), and commits its Add with the Welcome in the same `COMMIT`
// envelope. A device that loses the race gets `REJECTION_REASON_STALE_EPOCH`,
// sees the device is already a member and does nothing more.
// direct-messages: DM members kept complete. For a DM, `group_id` is the DM's
// and the notice goes to the DM's connected member devices, for each
// non-revoked, active, DM-capable device of either user that is not a
// member; the first to receive it adds the device under the DM commit authority
// rule. RejoinNotice works the same way per group.
message JoinNotice {
  bytes group_id = 1;
  // The device to add.
  DeviceRef device = 2;
}

// direct-messages: DM closed on user removal. Sent on every connect to each
// device of the other user that was a member of the DM, until the device sends
// `Ack` with this `group_id` and `server_seq` 0. The device marks the chat
// closed and keeps its history read-only; envelopes for it are rejected with
// `REJECTION_REASON_GROUP_CLOSED`. Never sent to a version 1 device, which is
// never in a DM.
message DmClosed {
  bytes group_id = 1;
  google.protobuf.Timestamp closed_at = 2;
}

// message-deletion: Removed-conversation sync. The caller's user removed this
// closed DM on one of their devices (`Dms.RemoveClosedDm`). Sent on every connect,
// one per entry of that user's private removed set, to that user's devices alone.
// It is a set, not a queue: there is no `Ack`. A device deletes the DM locally only
// if it has it and it is closed; otherwise it ignores the frame.
message ConversationRemoved {
  bytes group_id = 1;
}

// multi-group: Closing a named group. Sent to each member device of a closed
// named group on every connect until it sends `Ack(group_id, server_seq = 0)`.
// The client marks the chat closed and keeps its history read-only; envelopes for
// it are rejected with `REJECTION_REASON_GROUP_CLOSED`. Never sent to a device
// below protocol version 3, which is never in a named group.
message GroupClosed {
  bytes group_id = 1;
  google.protobuf.Timestamp closed_at = 2;
}
