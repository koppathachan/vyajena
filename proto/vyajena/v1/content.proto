// The plaintext inside every MLS application message.
//
// message-content: Inner content format. The plaintext of every MLS application
// message is an encoded `Content`. Only the Rust core encodes or decodes it; the
// Server never sees it and Flutter never sees protobuf.
syntax = "proto3";

package vyajena.v1;

import "google/protobuf/timestamp.proto";
import "vyajena/v1/common.proto";

// message-content: Inner content format. A client send time and exactly one
// body. A client that decrypts a `Content` whose body it does not know (the
// oneof decodes as unset) shows a placeholder saying the message needs a newer
// app version, and does not fail.
message Content {
  // The sender's clock when the user sent the message.
  google.protobuf.Timestamp sent_at = 1;
  oneof body {
    Text text = 2;
    GroupSettings group_settings = 3;
    Profile profile = 4;
    // message-content: Image messages (change `media-blobs`).
    Image image = 5;
    // message-content: Audio messages (change `audio-messages`). The next free
    // field after this one is 7 for the change that follows; `delete-messages`
    // takes it, so the two never collide.
    Audio audio = 6;
  }
}

// message-content: Image messages. One static image, stored as an encrypted blob
// on the server (blob-store). This body is what a receiver needs to show a blurred
// placeholder at once and to fetch and decrypt the full image on tap. A client
// that predates it decodes the body as unset and shows the "needs a newer app
// version" placeholder. Only the Rust core reads it; the server never sees it, and
// `blob_key` never leaves the encrypted `Content`.
message Image {
  // The random id the ciphertext is stored under on the server, 16 bytes
  // (`protocol::blob_store::BLOB_ID_LEN`). Unique per upload; no dedup.
  bytes blob_id = 1;
  // The fresh 256-bit XChaCha20-Poly1305 key for this blob, 32 bytes
  // (`protocol::blob_store::BLOB_KEY_LEN`).
  bytes blob_key = 2;
  // The WebP's pixel size, so the bubble lays out before the image downloads.
  // Both are at least 1 and at most `protocol::blob_store::MAX_IMAGE_EDGE`.
  uint32 width = 3;
  uint32 height = 4;
  // A ThumbHash of the image, shown as a blur until the full image is
  // downloaded; at most `protocol::blob_store::MAX_THUMBHASH_BYTES` bytes.
  bytes thumbhash = 5;
  // The blob ciphertext's size in bytes, at most
  // `protocol::blob_store::MAX_BLOB_BYTES`.
  uint64 blob_size = 6;
  // Optional caption: UTF-8, limited like `Text.text`.
  optional string caption = 7;
  // The mentions in `caption`, under the same rules as `Text.mentions`
  // (message-content: Image caption and mentions).
  repeated Mention caption_mentions = 8;
}

// message-content: Audio messages. One voice message: an Opus mono clip in an OGG
// container (RFC 7845), stored as an encrypted blob on the server (blob-store)
// exactly as an image is. This body is what a receiver needs to draw the bubble
// (duration and waveform) before anything downloads, and to fetch and decrypt the
// clip on tap. A client that predates it decodes the body as unset and shows the
// "needs a newer app version" placeholder. Only the Rust core reads it; the server
// never sees it, and `blob_key` never leaves the encrypted `Content`. There is no
// caption in this version.
message Audio {
  // The random id the ciphertext is stored under on the server, 16 bytes
  // (`protocol::blob_store::BLOB_ID_LEN`). Unique per upload; no dedup.
  bytes blob_id = 1;
  // The fresh 256-bit XChaCha20-Poly1305 key for this blob, 32 bytes
  // (`protocol::blob_store::BLOB_KEY_LEN`).
  bytes blob_key = 2;
  // The blob ciphertext's size in bytes, at most
  // `protocol::blob_store::MAX_BLOB_BYTES`.
  uint64 blob_size = 3;
  // The clip's length in milliseconds, at least 1 and at most
  // `protocol::audio::MAX_AUDIO_DURATION_MS`.
  uint32 duration_ms = 4;
  // Amplitude peaks of the clip, one byte per peak (0 silent, 255 loudest), evenly
  // spaced over its length, at most `protocol::audio::MAX_AUDIO_WAVEFORM_BYTES`
  // bytes. The bubble draws it as bar heights before the clip downloads.
  bytes waveform = 5;
}

// message-content: Text only. UTF-8 text, optional mentions and one optional
// reply reference, and nothing else: no attachments, link previews or rich
// formatting. The client limits text to what encrypts within
// the 65,536-byte ciphertext cap and refuses to send longer text
// (wire-transport: Size limits).
//
// message-content: Mentions; Replies (change `mentions`). `mentions` and
// `reply_to` are optional; a client that predates them ignores them as
// unknown fields and shows `text` alone, which still holds the typed "@Ali".
message Text {
  string text = 1;
  // The mentions in `text`, in any order; ranges never overlap.
  repeated Mention mentions = 2;
  // Set when this message answers another one.
  ReplyTo reply_to = 3;
}

// message-content: Mentions. One mention of a user, or of everyone, over a
// range of `Text.text`. `start` and `length` are UTF-8 byte offsets; the range
// is not empty, lies inside the text and on character boundaries, and does
// not overlap another mention. The sending client refuses a bad range; a
// receiving client drops it and still shows the text. Any member may mention
// `everyone`. Whether a message mentions a user is read from these targets,
// never from the text.
message Mention {
  // Mentions every member of the group.
  message Everyone {}

  oneof target {
    // A user mentioned by id.
    UserId user = 1;
    Everyone everyone = 2;
  }
  // UTF-8 byte offset of the range in `Text.text`.
  uint32 start = 3;
  // UTF-8 byte length of the range.
  uint32 length = 4;
}

// message-content: Replies. The message this one answers, and a short quote
// of it so a device without the original still shows what was answered.
message ReplyTo {
  // The device that sent the original, as its envelope's `sender` named it.
  DeviceRef sender = 1;
  // The original envelope's `msg_id` (16 bytes).
  bytes msg_id = 2;
  // The original's text with whitespace folded to single spaces, at most
  // `MAX_REPLY_QUOTE_CHARS` (100) Unicode scalar values, the last one "…" when
  // cut.
  // Receivers cut a longer quote to the limit.
  string quote = 3;
}

// message-content: Group settings travel encrypted. The group name and settings,
// which the server never sees (group-membership: Membership state on the server).
// Only messages from admin devices change them; clients ignore `GroupSettings`
// from non-admin devices.
message GroupSettings {
  // The group's display name.
  optional string name = 1;
}

// message-content: User-owned profiles. Clients apply a `Profile` only to the
// user whose device sent it, always show the username alongside the display
// name (e.g. "Ali (alice)"), and fall back to the username when no display name
// is set.
message Profile {
  optional string display_name = 1;
  // A short "about" text.
  optional string about = 2;
}
