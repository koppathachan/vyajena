// Keys service: the KeyPackage directory.
//
// All RPCs require a session token (wire-transport: Session authentication).
// KeyPackages are TLS-serialized MLS `KeyPackage` structures (RFC 9420 section
// 10), not wrapped in an `MLSMessage`.
syntax = "proto3";

package vyajena.v1;

import "vyajena/v1/common.proto";

// buf:lint:ignore SERVICE_SUFFIX
// Service name as used in the specs and design D11.
service Keys {
  // key-directory: KeyPackage upload.
  rpc UploadKeyPackages(UploadKeyPackagesRequest) returns (UploadKeyPackagesResponse);

  // key-directory: KeyPackage fetch.
  rpc FetchKeyPackages(FetchKeyPackagesRequest) returns (FetchKeyPackagesResponse);

  // key-directory: Identity key lookup.
  rpc GetIdentityKeys(GetIdentityKeysRequest) returns (GetIdentityKeysResponse);

  // group-membership: Re-add after an unusable Welcome. The calling device
  // could not use the Welcome that added it (or has no group while the Pi
  // counts it as a member) and asks to be added again, with fresh KeyPackages.
  rpc RequestReadd(RequestReaddRequest) returns (RequestReaddResponse);
}

// key-directory: KeyPackage upload. One-time KeyPackages plus exactly one
// last-resort KeyPackage. A device keeps 20 one-time KeyPackages on the Pi and
// uploads more when told its count dropped below 5 (design D10;
// key-directory: Replenishment signal).
//
// The Pi accepts a KeyPackage only if it parses, uses ciphersuite
// `MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519`, its credential carries the
// uploading device's certificate, and its signature key equals that
// certificate's MLS signature key. A KeyPackage whose credential names a
// different device fails the whole upload with `PERMISSION_DENIED`.
message UploadKeyPackagesRequest {
  // One-time KeyPackages; each is handed out at most once.
  repeated bytes key_packages = 1;
  // The last-resort KeyPackage, handed out when no one-time KeyPackage remains.
  bytes last_resort_key_package = 2;
}

message UploadKeyPackagesResponse {}

// key-directory: KeyPackage fetch. An unknown `user_id` is rejected with
// `NOT_FOUND`.
message FetchKeyPackagesRequest {
  UserId user_id = 1;
  // Optional. When set, the Pi returns, and consumes, KeyPackages only for
  // these devices of `user_id` (16-byte device ids). If any of them is not a
  // non-revoked device of that user, the call fails with `NOT_FOUND` and
  // consumes nothing. Used to re-add one inactive device (design D7) without
  // using up a one-time KeyPackage of each of the user's other devices. When
  // empty, the Pi returns one for every non-revoked device of the user.
  repeated bytes device_ids = 2;
  // Optional (change `dms`, key-directory: KeyPackage fetch). When set to a
  // DM's group id, the Pi returns only KeyPackages whose capabilities list
  // the DM extension `0xF0A2` (devices with none are left out), and rejects the call with `PERMISSION_DENIED` unless the
  // caller's device is a member of that DM and `user_id` is one of its two
  // users. An unknown group id is rejected with `NOT_FOUND`.
  bytes group_id = 3;
}

// key-directory: KeyPackage fetch. One entry per requested device: every
// non-revoked device of the user, or only those in
// `FetchKeyPackagesRequest.device_ids`. The Pi hands out each one-time
// KeyPackage at most once and falls back to the device's last-resort KeyPackage
// when none remain.
//
// key-directory: Clients verify the identity chain. The client verifies every
// device certificate against `identity_public_key`, pins each user's identity
// key on first sight, and refuses to add a user's devices (and warns the user)
// if a later fetch returns a different identity key for a pinned user.
message FetchKeyPackagesResponse {
  // The user's identity public key (Ed25519, 32 bytes).
  bytes identity_public_key = 1;
  repeated DeviceKeyPackage devices = 2;
}

message DeviceKeyPackage {
  SignedDeviceCertificate certificate = 1;
  bytes key_package = 2;
}

// key-directory: Identity key lookup. Each listed user's current identity
// public key, consuming no KeyPackages. A device uses it to pin the identity
// keys of users it meets in a Welcome or in someone else's commit, and to look
// a key up again when a certificate does not verify against the pinned one
// (key-directory: Clients verify the identity chain). If any listed user id is
// unknown or has no non-revoked device, the call fails with `NOT_FOUND` and
// returns nothing.
message GetIdentityKeysRequest {
  repeated UserId user_ids = 1;
}

// key-directory: Identity key lookup. One entry per distinct requested user,
// in request order.
message GetIdentityKeysResponse {
  repeated UserIdentityKey keys = 1;
}

message UserIdentityKey {
  UserId user_id = 1;
  // The user's identity public key (Ed25519, 32 bytes).
  bytes identity_public_key = 2;
}

// group-membership: Re-add after an unusable Welcome.
//
// Sent by a device that refused a Welcome, or that has no group when its core
// starts. The Pi answers `READD_OUTCOME_ASKED` only if the calling device is a
// non-revoked member in the tree, is not already waiting to be re-added, has
// no Welcome queued after `refused_welcome_seq`, and has asked fewer than
// `protocol::group_membership::MAX_READD_REQUESTS_PER_DAY` times in the last
// 24 hours. Then, in one transaction, it replaces all of the device's
// KeyPackages with the ones in this request (checked as in
// `UploadKeyPackages`), marks the device inactive and back (so it issues its
// external Remove proposal and sends a `RejoinNotice` for it to the devices
// that may re-add it), and logs `reason`. Otherwise it changes nothing and
// stores no KeyPackage.
//
// The Pi gains no power from this: it adds no one; a member device commits the
// re-add after checking the KeyPackage's certificate against the user's pinned
// identity key, as for every add.
message RequestReaddRequest {
  // The `server_seq` of the Welcome this device refused; 0 when it asks
  // because it has no group at start. A Welcome queued for it with a higher
  // `server_seq` means it should process that one first.
  uint64 refused_welcome_seq = 1;
  // Why the device could not use the Welcome: the core's error text, for the
  // Pi's log. At most `protocol::group_membership::MAX_READD_REASON_BYTES`
  // bytes; never message content.
  string reason = 2;
  // Fresh one-time KeyPackages; they replace all of the device's stored ones.
  repeated bytes key_packages = 3;
  // A fresh last-resort KeyPackage.
  bytes last_resort_key_package = 4;
}

message RequestReaddResponse {
  ReaddOutcome outcome = 1;
}

enum ReaddOutcome {
  READD_OUTCOME_UNSPECIFIED = 0;
  // The Pi marked the device for a re-add and stored its new KeyPackages.
  READD_OUTCOME_ASKED = 1;
  // The device is not in the tree: it waits for its first add (`JoinNotice`)
  // as usual. Nothing changed.
  READD_OUTCOME_NOT_A_MEMBER = 2;
  // A Welcome for the device is still queued: process it first. Nothing
  // changed.
  READD_OUTCOME_WELCOME_QUEUED = 3;
  // The device already waits to be re-added (inactive). Nothing changed.
  READD_OUTCOME_ALREADY_WAITING = 4;
  // The device asked too often in the last 24 hours. Nothing changed.
  READD_OUTCOME_LIMIT_REACHED = 5;
}
