[workspace]
resolver = "3"
members = ["bridge", "client", "pbgen", "protocol", "server"]
# Throwaway spikes (git-ignored) build on their own, outside the workspace.
exclude = ["spikes"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
publish = false

# The server tests make a throwaway 2048-bit RSA key (push tasks 1.4); unoptimised
# that takes many seconds.
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3

# The image pipeline's tests (media-blobs) decode, scale and encode multi-megapixel
# pictures; unoptimised the codecs take tens of seconds.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.libwebp-sys]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3

# The voice encoder's tests (audio-messages) encode up to two minutes of audio;
# unoptimised the pure-Rust Opus encoder takes minutes.
[profile.dev.package.opus-pure]
opt-level = 3
