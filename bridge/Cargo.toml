[package]
name = "bridge"
version = "0.1.0"
description = "Thin flutter_rust_bridge glue: exposes client::Client and its event stream to the Flutter app with plain types (flutter-app design D2)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib (Android) and staticlib (iOS) for the app, built by cargokit from
# app/rust_builder; rlib for bridge/tests.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
client = { path = "../client" }
# Pinned: the generated src/frb_generated.rs and app/lib/src/rust/ must match
# the runtime exactly. Regenerated locally only (CLAUDE.md), never in CI.
flutter_rust_bridge = "=2.12.0"
tokio = { version = "1", features = ["sync"] }
thiserror = "2"

[dev-dependencies]
# End-to-end tests run the real Pi in-process, with the client tests' helpers
# (bridge/tests/support).
server = { path = "../server" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
prost = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
parking_lot = "0.12"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints.rust]
# frb's macros check `cfg(frb_expand)`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
